aid: careacademy
name: CareAcademy
description: >-
  CareAcademy (part of Activated Insights) is an online training, compliance, and
  workforce-management platform for post-acute care — home care, home health,
  hospice, and senior living organizations. It automates regulatory training
  assignment, caregiver onboarding, and audit-ready compliance reporting for
  2,500+ organizations and 800K+ caregivers. The CareAcademy API lets integration
  partners (home-care software platforms) create agency organizations and
  caregivers, provide Single Sign-On into CareAcademy from their own product, and
  query course-completion and compliance data in real time. The partner API is an
  OpenAPI 3.0 REST interface using HTTP Basic authentication, published on
  SwaggerHub, with named integrations for WellSky, AxisCare, AlayaCare, eRSP,
  Aaniie, and Spectrum TeleTrack Services.

overlay: 1.0.0
info:
  title: API Evangelist enhancements for CareAcademy API
  version: 1.0.0
extends: openapi/careacademy-openapi-original.yml
actions:
  - target: $.info
    update:
      x-apievangelist-enriched: '2026-07-18'
      x-apievangelist-provider: careacademy
      x-apievangelist-notes: >-
        HTTP Basic auth; caller-owned integration IDs act as upsert keys; FHIR
        HumanName/ContactPoint datatypes; page[after] pagination on compliance_report.
  - target: $.paths['/organizations/{organizationIntegrationId}'].post
    update:
      operationId: createOrganization
      tags: [Organizations]
  - target: $.paths['/organizations/{organizationIntegrationId}'].put
    update:
      operationId: flagOrganizationForReview
      tags: [Organizations]
  - target: $.paths['/locations/{organizationIntegrationId}'].post
    update:
      operationId: createLocations
      tags: [Locations]
  - target: $.paths['/sign_in_url'].get
    update:
      operationId: getSignInUrl
      tags: [SSO]
  - target: $.paths['/compliance_report/{organizationIntegrationId}'].get
    update:
      operationId: getComplianceReport
      tags: [Compliance]
  - target: $.paths['/practitioners'].post
    update:
      operationId: createPractitioner
      tags: [Practitioners]
  - target: $.paths['/practitioners/{integrationId}'].put
    update:
      operationId: updatePractitioner
      tags: [Practitioners]
